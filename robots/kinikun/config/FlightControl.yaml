aerial_robot_control_name: aerial_robot_control/kinikun_controller

controller:
  xy:
    p_gain: 4.6
    i_gain: 0.08
    d_gain: 3.3
    limit_sum: 3
    limit_p: 3
    limit_i: 1.5
    limit_d: 3

  z:
    p_gain: 5.2
    i_gain: 2.7
    d_gain: 4.0
    limit_err_p: 1.0
    limit_sum: 10 # N for clamping thrust force
    limit_p: 20 # m / s^2
    limit_i: 40 # m / s^2
    limit_d: 20 # m / s^2
    landing_err_z: -0.2
    force_landing_descending_rate: -0.6

  yaw:
    limit_sum: 6.0 # N for clamping thrust force
    limit_p: 4.0
    limit_i: 4.0
    limit_d: 4.0
    limit_err_p: 0.4
    need_d_control: false

  # LQI gain generator
  lqi:
    gain_generate_rate: 15.0
    gyro_moment_compensation: true
    clamp_gain: true

    roll_pitch_p: 50
    roll_pitch_i: 0.45
    roll_pitch_d: 4.5

    yaw_p: 50
    yaw_i: 0.5
    yaw_d: 0.2

    r1: 1.0
    r2: 1.0
    r3: 1.0
    r4: 1.0

    trans_constraint_weight: 100
    att_control_weight: 1

  # 外部力推定設定
  wrench_estimate_flag: false
  wrench_estimate_update_rate: 100.0
  momentum_observer_force_weight: 10.0
  momentum_observer_torque_weight: 10.0
  
  # 外部力補償設定
  wrench_comp_mode: false
  comp_term_update_freq: 10.0
  external_force_upper_limit: 5.0
  external_force_lower_limit: -5.0
  external_torque_upper_limit: 0.5
  external_torque_lower_limit: -0.5
  
  wrench_comp:
    p_gain: 0.1
    i_gain: 0.005
    d_gain: 0.07

